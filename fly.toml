# fly.toml app configuration file generated for fable-mexc-bot on 2026-08-05T15:47:43-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fable-mexc-bot'
primary_region = 'nrt'

[build]
[http_service]
  min_machines_running = 1
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[deploy]
  strategy = "rolling"
  release_command = "pnpm migrate"
